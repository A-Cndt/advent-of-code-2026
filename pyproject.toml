
[project]
name = "advent-of-code-2026"
version = "0.1.0"
description = "Python solutions for Advent of Code 2026"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "mypy",
    "bandit",
    "radon",
    "sphinx",
    "pip-audit",
    "PySide6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I", "B", "UP",
    "SIM", "C4",
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.coverage.run]
source = ["aoc2026"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
