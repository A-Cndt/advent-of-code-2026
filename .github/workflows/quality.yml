
name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit

      - name: Ruff lint
        run: ruff check src/ tests/ days/

      - name: Ruff format
        run: ruff format --check src/ tests/ /days

      - name: Mypy
        run: mypy src/ /days

      - name: Bandit
        run: bandit -r src/ /days -ll
